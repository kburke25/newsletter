<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bronxdale Language in Action family newsletter">
  <title>Language in Action | Bronxdale</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="school-bar">
    <img src="bronxdale-logo.png" alt="Bronxdale" class="school-logo">
    <p id="tagline">BUILDING LANGUAGE, CONFIDENCE, AND CONNECTION TOGETHER</p>
  </header>

  <main>
    <section class="hero" aria-labelledby="page-title">
      <img src="hero-books.jpg" alt="Old books on a shelf">
      <div class="hero-overlay">
        <h1 id="page-title">Language in Action</h1>
        <p id="subtitle">HIGH SCHOOL ENGLISH LANGUAGE ARTS</p>
      </div>
    </section>

    <section class="controls" aria-label="Newsletter controls">
      <div class="control-group">
        <label id="language-label" for="language">Language</label>
        <select id="language" aria-label="Choose a language"></select>
      </div>
      <div class="control-group">
        <label id="edition-label" for="edition">Newsletter edition</label>
        <select id="edition" aria-label="Choose a newsletter edition"></select>
      </div>
      <p id="week" class="week">Week of October 19–23, 2026</p>
    </section>

    <section id="newsletter-grid" class="newsletter-grid" aria-live="polite"></section>
    <section id="family-resources" class="family-resources" hidden></section>
  </main>

  <footer>
    <p class="footer-school">Bronxdale High School • Language in Action</p>
    <p class="contact-line">Email Ms. Burke at <a href="mailto:kburke25@schools.nyc.gov">kburke25@schools.nyc.gov</a> or text me in your language at <a href="sms:+13476403806">(347) 640-3806</a>.</p>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
